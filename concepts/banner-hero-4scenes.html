<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hero — Proposal Writing</title>
<meta name="viewport" content="width=1452, initial-scale=1" />
<style>
  /*
    ════════════════════════════════════════════════════════════
    PROPOSAL WRITING — single scene, 5s loop
    ════════════════════════════════════════════════════════════
      0.00 – 0.40  PD-F1 enter (unstructured UI)
      0.40 – 1.50  Scanner sweeps every line of the document
      1.50 – 2.50  F1 → F2 transition
      2.50 – 3.50  PD-F2 hold (structuring)
      3.50 – 4.10  F2 → F3 transition
      4.10 – 4.70  PD-F3 hold + "Approved" badge appears on top
      4.70 – 5.00  Scene exit + restart
    ════════════════════════════════════════════════════════════

    PD-frame coordinates (banner 1452 × 709):
      Card outer        x=537, y=120, w=378, h=475
      Card content      x=545, y=141, w=353, h=355
      Search box        x=555, y=154, w=105, h=15
      Document area     x=565, y=198, w=320, h=281
      First skeleton    x=568, y=211, w=304, h=8
      Last skeleton row y≈460
  */
  :root {
    --loop: 5s;
    --ink-900: #0F1115;
    --ink-700: #1F2330;
    --ink-500: #454545;
    --ink-400: #6B6F7A;
    --ink-300: #BABABA;
    --ink-200: #D8D8D8;
    --ink-100: #F3F3F3;
    --blue-500: #3362F3;
    --blue-200: #ADC0FA;
    --green-500: #16A34A;
    --green-50:  #ECFDF3;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }

  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: grid; place-items: center;
    background: #fff;
    overflow: hidden;
  }

  .banner {
    position: relative;
    width: min(100vw, calc(100vh * (1452 / 709)));
    aspect-ratio: 1452 / 709;
    overflow: hidden;
    background: #fff;
    animation: banner-breathe 6s ease-in-out infinite;
  }
  @keyframes banner-breathe {
    0%, 100% { transform: scale(1.000); }
    50%      { transform: scale(1.008); }
  }

  /* ── Frames: stacked img elements crossfading ───────────── */
  .frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    will-change: opacity, transform, filter;
    opacity: 0;
    transform: translate3d(0,0,0) scale(1);
    filter: blur(0);
  }

  /* Inner-frame timings (within 5s loop):
       PD-F1 enter:  0%  → 8%
       PD-F1 hold:   8%  → 30%   (scanner sweeps)
       F1 → F2:     30%  → 50%
       PD-F2 hold:  50%  → 70%
       F2 → F3:     70%  → 82%
       PD-F3 hold:  82%  → 94%   (badge appears)
       Exit:        94%  → 100%
  */
  .frame.pd-1 { animation: pd1 var(--loop) cubic-bezier(.22,.61,.36,1) infinite; }
  @keyframes pd1 {
    0%    { opacity: 0; transform: translate3d(1.2%,0,0)  scale(.99);  filter: blur(6px); }
    8%    { opacity: 1; transform: translate3d(0,0,0)     scale(1);    filter: blur(0); }
    30%   { opacity: 1; transform: translate3d(-0.2%,0,0) scale(1.002); filter: blur(0); }
    50%   { opacity: 0; transform: translate3d(-1.2%,0,0) scale(.992); filter: blur(6px); }
    100%  { opacity: 0; }
  }
  .frame.pd-2 { animation: pd2 var(--loop) cubic-bezier(.22,.61,.36,1) infinite; }
  @keyframes pd2 {
    0%, 30% { opacity: 0; transform: scale(.99) translate3d(0, .6%, 0); filter: blur(6px); }
    50%     { opacity: 1; transform: scale(1)     translate3d(0, 0, 0); filter: blur(0); }
    70%     { opacity: 1; transform: scale(1.004) translate3d(0,-.2%,0); filter: blur(0); }
    82%     { opacity: 0; transform: scale(1.012) translate3d(0,-.5%,0); filter: blur(6px); }
    100%    { opacity: 0; }
  }
  .frame.pd-3 { animation: pd3 var(--loop) cubic-bezier(.22,.61,.36,1) infinite; }
  @keyframes pd3 {
    0%, 70% { opacity: 0; transform: translate3d(0, 1.2%, 0) scale(.992); filter: blur(6px); }
    82%     { opacity: 1; transform: translate3d(0, 0, 0)    scale(1);    filter: blur(0); }
    94%     { opacity: 1; transform: translate3d(0,-.3%, 0)  scale(1.003); filter: blur(0); }
    100%    { opacity: 0; transform: translate3d(0,-1.0%, 0) scale(.992); filter: blur(6px); }
  }

  /* ── Skeleton shimmer over card content (continuous) ───── */
  .shimmer {
    position: absolute;
    left: 37.53%; top: 19.89%;
    width: 24.31%; height: 50.07%;
    overflow: hidden;
    border-radius: 4px;
    pointer-events: none;
    opacity: 0;
    animation: shimmer-show var(--loop) linear infinite;
  }
  @keyframes shimmer-show {
    0%, 4%   { opacity: 0; }
    8%       { opacity: .55; }
    48%      { opacity: .55; }
    52%      { opacity: 0; }
    100%     { opacity: 0; }
  }
  .shimmer::before {
    content: "";
    position: absolute; top: 0; bottom: 0;
    left: -45%; width: 30%;
    background: linear-gradient(
      100deg,
      transparent 0%,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0.45) 50%,
      rgba(255,255,255,0) 60%,
      transparent 100%);
    filter: blur(3px);
    animation: shimmer-sweep 1.4s ease-in-out infinite;
  }
  @keyframes shimmer-sweep {
    0%   { transform: translateX(0); }
    100% { transform: translateX(450%); }
  }

  /* ── Scanner — sweeps every line of the document area ──── */
  /* Document grey area in F1: x=565, y=198, w=320, h=281
     → left 38.91%, top 27.93%, width 22.04%, height 39.63% */
  .scanner {
    position: absolute;
    left: 38.91%; top: 27.93%;
    width: 22.04%; height: 39.63%;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    animation: scanner-show var(--loop) linear infinite;
  }
  @keyframes scanner-show {
    0%, 6%   { opacity: 0; }
    9%       { opacity: 1; }
    46%      { opacity: 1; }
    50%      { opacity: 0; }
    100%     { opacity: 0; }
  }
  /* Trailing tinted region beneath the scanner line — fills the area as it scans */
  .scanner::after {
    content: "";
    position: absolute; left: 0; right: 0; top: 0;
    height: 0;
    background: linear-gradient(
      180deg,
      rgba(51,98,243,.04) 0%,
      rgba(51,98,243,.10) 60%,
      rgba(51,98,243,.16) 100%);
    animation: scanner-trail var(--loop) cubic-bezier(.45,.05,.55,.95) infinite;
  }
  @keyframes scanner-trail {
    0%, 8%   { height: 0; }
    48%      { height: 100%; }
    52%, 100%{ height: 0; }
  }
  /* The scan line itself */
  .scanner::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 0;
    height: 2px;
    background: linear-gradient(
      90deg,
      rgba(51,98,243,0)   0%,
      rgba(51,98,243,.55) 14%,
      #ffffff             50%,
      rgba(51,98,243,.55) 86%,
      rgba(51,98,243,0)  100%);
    box-shadow:
      0 0  3px 0 rgba(51,98,243,.95),
      0 0 14px 2px rgba(51,98,243,.55),
      0 4px 22px 4px rgba(51,98,243,.30);
    animation: scanner-sweep var(--loop) cubic-bezier(.45,.05,.55,.95) infinite;
  }
  @keyframes scanner-sweep {
    0%, 8%   { top: 0; opacity: 0; }
    9%       { top: 0; opacity: 1; }
    48%      { top: calc(100% - 2px); opacity: 1; }
    50%      { top: calc(100% - 2px); opacity: 0; }
    100%     { top: 0; opacity: 0; }
  }

  /* ── Approved badge — appears on top of the document on F3 ── */
  /* Card top edge: y=120 → 16.93%. Place badge slightly above the card top. */
  .badge {
    position: absolute;
    left: 50%; top: 14.4%;
    transform: translate(-50%, 8px) scale(.7);
    padding: 6px 12px 6px 6px;
    background: #fff;
    color: var(--green-500);
    border: 1px solid rgba(22,163,74,.22);
    border-radius: 999px;
    box-shadow:
      0  6px 16px -6px rgba(22,163,74,.45),
      0  2px  6px -2px rgba(15,17,21,.10);
    font: 600 11px/1 "Suisse Int'l", Inter, system-ui, sans-serif;
    letter-spacing: .3px;
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
    opacity: 0;
    z-index: 6;
    animation: badge-show var(--loop) cubic-bezier(.18,.85,.24,1.18) infinite;
  }
  .badge .check {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--green-500);
    color: #fff;
    display: inline-grid; place-items: center;
    font-size: 9px; font-weight: 800;
    line-height: 1;
  }
  @keyframes badge-show {
    0%, 78%   { opacity: 0; transform: translate(-50%, 8px) scale(.7); }
    84%       { opacity: 1; transform: translate(-50%, 0)   scale(1.06); }
    88%       { opacity: 1; transform: translate(-50%, 0)   scale(1); }
    96%       { opacity: 1; transform: translate(-50%, 0)   scale(1); }
    100%      { opacity: 0; transform: translate(-50%, -4px) scale(.92); }
  }

  /* ── Card-objects ease-in: white wipe down the card on each frame enter ── */
  .card-wipe {
    position: absolute;
    left: 37.53%; top: 19.89%;
    width: 24.31%; height: 50.07%;
    overflow: hidden;
    border-radius: 4px;
    pointer-events: none;
  }
  .card-wipe::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(
      180deg,
      rgba(255,255,255,0)   0%,
      rgba(255,255,255,.55) 35%,
      rgba(255,255,255,.75) 50%,
      rgba(255,255,255,.55) 65%,
      rgba(255,255,255,0)  100%);
    transform: translateY(-110%);
    animation: card-wipe var(--loop) cubic-bezier(.22,.61,.36,1) infinite;
  }
  @keyframes card-wipe {
    0%      { transform: translateY(-110%); }
    10%     { transform: translateY(110%); }   /* PD-F1 enter wipe */
    49%     { transform: translateY(110%); }
    50%     { transform: translateY(-110%); }
    60%     { transform: translateY(110%); }   /* PD-F2 enter wipe */
    81%     { transform: translateY(110%); }
    82%     { transform: translateY(-110%); }
    92%     { transform: translateY(110%); }   /* PD-F3 enter wipe */
    100%    { transform: translateY(110%); }
  }

  /* Pause everything on hover for inspection */
  .stage:hover .frame,
  .stage:hover .shimmer,
  .stage:hover .shimmer::before,
  .stage:hover .scanner,
  .stage:hover .scanner::before,
  .stage:hover .scanner::after,
  .stage:hover .badge,
  .stage:hover .card-wipe::before,
  .stage:hover .banner { animation-play-state: paused; }

  .hud {
    position: fixed; left: 14px; bottom: 12px;
    font: 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--ink-400); user-select: none; letter-spacing: .3px;
  }
  .hud strong { color: var(--ink-700); font-weight: 600; }
</style>
</head>
<body>
  <div class="stage">
    <div class="banner" id="banner">
      <img class="frame pd-1" src="scenes/pd/frame-1.svg" alt="" draggable="false" />
      <img class="frame pd-2" src="scenes/pd/frame-2.svg" alt="" draggable="false" />
      <img class="frame pd-3" src="scenes/pd/frame-3.svg" alt="" draggable="false" />
      <div class="shimmer" aria-hidden="true"></div>
      <div class="scanner" aria-hidden="true"></div>
      <div class="card-wipe" aria-hidden="true"></div>
      <div class="badge" aria-hidden="true"><span class="check">&#10003;</span>Approved</div>
    </div>
  </div>
  <div class="hud"><strong>Hero</strong> &middot; Proposal Writing &middot; 5s loop</div>
</body>
</html>
